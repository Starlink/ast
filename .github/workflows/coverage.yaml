name: Coverage

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

#  Every push to a branch is checked, and so is every pull request -- the
#  latter so that forks are covered too, since a fork's push never reaches
#  this repository.  For a branch in this repository with an open pull request
#  that does mean two runs of the same commit; the concurrency group below at
#  least cancels runs a newer push has superseded, except on master where the
#  completed record is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  coverage:
    runs-on: ubuntu-latest

    #  A fork cannot upload to Codecov: secrets do not reach it, so its own push
    #  runs have no CODECOV_TOKEN, and the tokenless path the action uses for a
    #  pull request from a fork does not apply to a push.  The secret is exposed
    #  as job-level env so the upload step's `if' can see whether there is one --
    #  `if' cannot read the secrets context, nor a step's own env block.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libyaml-dev lcov libplplot-dev plplot-driver-cairo

      - name: Configure
        env:
          CC: gcc
        run: >
          cmake -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DAST_ENABLE_COVERAGE=ON
          -DAST_C_STANDARD=11

      - name: Build
        run: cmake --build build-coverage --parallel

      - name: Run tests and generate coverage report
        run: cmake --build build-coverage --target coverage-report

      - name: Generate HTML coverage report
        run: cmake --build build-coverage --target coverage-html
        continue-on-error: true

      - name: Upload lcov report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: build-coverage/coverage/lcov.info

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('build-coverage/coverage/html/index.html') != '' }}
        with:
          name: coverage-html
          path: build-coverage/coverage/html

      - name: Upload to Codecov
        #  Skip where no upload can succeed rather than failing the run: a push
        #  to a fork.  A pull request from a fork still uploads, tokenlessly and
        #  against the base repository, which is what covers those commits.
        if: ${{ env.CODECOV_TOKEN != '' || github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v6
        with:
          files: build-coverage/coverage/lcov.info
          # Upload only the curated src/*-only lcov.info. Without this the
          # action also auto-discovers the raw .gcda files from the test
          # executables in ast_tester/, pulling test harness code (e.g. the
          # stopit() error paths that never fire on a passing run) into the
          # report.
          disable_search: true
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
